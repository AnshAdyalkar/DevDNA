name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    # Phase 2 auth tests run against a real MongoDB (devdna_test database).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace backend
      - name: Type check
        run: npm run typecheck --workspace backend
      - name: Test
        run: npm run test --workspace backend

  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace frontend
      - name: Type check
        run: npm run typecheck --workspace frontend
      - name: Test
        run: npm run test --workspace frontend
      - name: Build
        run: npm run build --workspace frontend

  intelligence:
    name: Python — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r intelligence/requirements.txt
      - name: Lint
        run: ruff check intelligence/app intelligence/tests
      - name: Type check
        run: mypy intelligence/app
      - name: Test
        run: pytest intelligence/tests -q
