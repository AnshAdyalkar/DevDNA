[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() pattern

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Motor's async API lacks complete stubs; Mongo-bound modules stay lenient.
[[tool.mypy.overrides]]
module = [
  "app.services.mongodb",
  "app.services.repository_service",
  "app.services.behavior",
  "app.services.gaps",
  "networkx",
]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
